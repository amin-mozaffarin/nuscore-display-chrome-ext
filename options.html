<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Options</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; min-width: 350px; }
    h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; }
    input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .actions { display: flex; gap: 10px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    #save { background-color: #2563eb; color: white; }
    #save:hover { background-color: #1d4ed8; }
    #reset { background-color: #f3f4f6; color: #374151; }
    #reset:hover { background-color: #e5e7eb; }
    #status { margin-top: 10px; font-size: 13px; height: 18px; color: #059669; }
  </style>
</head>
<body>
  <div class="form-group">
    <label for="displayIP">Display IP</label>
    <input type="text" id="displayIP">
  </div>

  <div class="actions">
    <button id="save">Save Settings</button>
    <button id="reset">Reset to Default</button>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
